<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces&family=Montserrat&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="style.css" />

    <title> Perfume product card</title>
  </head>
  <body>
    <div class="card">
      <div class="img">
        <img
          src="/image-product-desktop.jpg"
          alt="Chanel Gabrielle Essence Eau De Parfum bottle"
          height="465px"
        />
      </div>
      <div class="content">
        <p>P E R F U M E</p>
        <h1>
          Gabrielle <br />
          Essence Eau <br />
          De Perfume
        </h1>
        <div class="info">
          <p>
            A floral solar and voluptuous interpretation composed by Olivier
            Polge, Perfume-Creator for the house of CHANEL.
          </p>
        </div>
        <div class="price">
          <h2>$149.99</h2>
          <span><s>$169.99</s></span>
        </div>
        <div class="button">
          <button><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
        </div>
      </div>
    </div>
  </body>
</html>
